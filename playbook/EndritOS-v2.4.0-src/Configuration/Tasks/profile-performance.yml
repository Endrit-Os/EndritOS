---
title: Endrit OS — Performance Profile
description: Maximum tweaks. IFEO telemetry blocks, extra service disables. May affect anti-cheat — test in VM.
privilege: TrustedInstaller
actions:

  - !writeStatus: {status: "Endrit OS: Applying Performance profile"}

  # Additional service disables (beyond Ranked Safe)
  - !service: {name: 'SysMain',   operation: change, startup: 4}
  - !service: {name: 'WSearch',   operation: change, startup: 4}
  - !service: {name: 'Themes',    operation: change, startup: 4}
  - !service: {name: 'TabletInputService', operation: change, startup: 4}
  - !service: {name: 'lmhosts',   operation: change, startup: 4}
  - !service: {name: 'NlaSvc',    operation: change, startup: 3}
  - !service: {name: 'DPS',       operation: change, startup: 4}

  # IFEO telemetry blocks (NOT on game exes)
  - !registryValue: {path: 'HKLM\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Image File Execution Options\CompatTelRunner.exe', value: 'Debugger', type: REG_SZ, data: '%windir%\System32\taskkill.exe'}
  - !registryValue: {path: 'HKLM\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Image File Execution Options\DeviceCensus.exe', value: 'Debugger', type: REG_SZ, data: '%windir%\System32\taskkill.exe'}
  - !registryValue: {path: 'HKLM\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Image File Execution Options\WerFault.exe', value: 'Debugger', type: REG_SZ, data: '%windir%\System32\taskkill.exe'}
  - !registryValue: {path: 'HKLM\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Image File Execution Options\dmclient.exe', value: 'Debugger', type: REG_SZ, data: '%windir%\System32\taskkill.exe'}

  # Write config
  - !powerShell:
      wait: true
      command: >-
        $c = 'C:\ProgramData\EndritOS\config.json';
        if (Test-Path $c) {
          $j = Get-Content $c -Raw | ConvertFrom-Json;
          $j.version = '2.4.0'; $j.profile = 'performance'; $j.competitiveReady = $false;
          $j | ConvertTo-Json | Set-Content $c -Encoding UTF8
        }
