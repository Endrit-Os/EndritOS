<?xml version="1.0" encoding="utf-8"?>
<Playbook>
    <Name>Endrit OS</Name>
    <Version>2.4.0</Version>
    <Author>Endrit OS Team</Author>
    <Description>Optimized Windows 11. Ranked Safe for Valorant, CS2, Apex. 500+ tweaks from Atlas + ReviOS sources. Local Toolbox included.</Description>
    <Details>https://192.109.200.182/docs/</Details>
    <Git>https://github.com/endrit-os/EndritOS</Git>
    <Discord>https://discord.gg/endritos</Discord>
    <SupportedBuilds>
        <string>26100</string>
    </SupportedBuilds>
    <SupportedEditions>
        <string>Home</string>
        <string>Pro</string>
        <string>Education</string>
        <string>Pro Education</string>
    </SupportedEditions>
    <Requirements>
        <Requirement>DefenderDisabled</Requirement>
    </Requirements>
    <ExperiementalWarning>false</ExperiementalWarning>
    <Options>
        <Option Id="ranked-safe">
            <Name>Ranked Safe (Recommended)</Name>
            <Description>Keeps Defender on. Safe for Valorant (Vanguard), CS2 (VAC), Apex (EAC). Default for most users.</Description>
            <DefaultChecked>true</DefaultChecked>
        </Option>
        <Option Id="performance">
            <Name>Performance Mode</Name>
            <Description>Maximum tweaks: IFEO blocks on telemetry, extra service disables. May trigger anti-cheat on some games. Test in VM first.</Description>
            <DefaultChecked>false</DefaultChecked>
        </Option>
        <Option Id="laptop">
            <Name>Laptop Optimizations</Name>
            <Description>Balanced power plan for gaming laptops. Keeps battery-saving features active on DC power.</Description>
            <DefaultChecked>false</DefaultChecked>
        </Option>
        <Option Id="remove-ai">
            <Name>Remove AI / Copilot components</Name>
            <Description>Removes Windows Copilot, Recall, and AI features via DISM. Recommended for privacy.</Description>
            <DefaultChecked>true</DefaultChecked>
        </Option>
        <Option Id="remove-onedrive">
            <Name>Remove OneDrive</Name>
            <Description>Uninstalls OneDrive and removes its SXS components.</Description>
            <DefaultChecked>false</DefaultChecked>
        </Option>
    </Options>
</Playbook>
