name: Bug Report
description: Something broke after installing Endrit OS
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        **Before filing:** Check [known issues](http://192.109.200.182/docs/known-issues.html) and run **Endrit Toolbox → Competitive → Verify**.
  - type: input
    id: version
    attributes:
      label: Endrit OS version
      placeholder: "e.g. v2.4.0"
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows build
      placeholder: "e.g. 26100.3775 — run winver"
    validations:
      required: true
  - type: dropdown
    id: profile
    attributes:
      label: Install profile used
      options:
        - Ranked Safe (default)
        - Performance
        - Laptop
        - Unknown / not sure
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What happened?
      placeholder: Describe the bug clearly — what you expected vs what actually happened.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Install Endrit OS with ...
        2. Open ...
        3. See error
  - type: textarea
    id: logs
    attributes:
      label: Logs / screenshots
      description: Toolbox Competitive check output, AME error log, Event Viewer, screenshots.
